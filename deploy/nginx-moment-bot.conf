# /etc/nginx/sites-available/moment-bot
server {
  listen 80;
  listen [::]:80;
  server_name moment-bot.iskren.info;

  location /.well-known/acme-challenge/ { root /var/lib/letsencrypt/webroot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name moment-bot.iskren.info;
  ssl_certificate /etc/letsencrypt/live/moment-bot.iskren.info/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/moment-bot.iskren.info/privkey.pem;

  location /.well-known/acme-challenge/ { root /var/lib/letsencrypt/webroot; }
  location / {
    proxy_pass http://127.0.0.1:9292;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
